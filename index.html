<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f9f9f7;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #0b0b0b;
  }
  .gate {
    background: #fcfcfb;
    border: 1px solid #e1e0d9;
    border-radius: 10px;
    padding: 36px 40px;
    width: 340px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #898781; margin-bottom: 24px; }
  label { font-size: 11px; font-weight: 500; color: #52514e; display: block; margin-bottom: 6px; }
  input[type=password] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #e1e0d9;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 12px;
    background: #fff;
    color: #0b0b0b;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #2a78d6; }
  button {
    width: 100%;
    padding: 9px 12px;
    background: #0b0b0b;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #333; }
  button:disabled { background: #c3c2b7; cursor: default; }
  .error {
    font-size: 12px;
    color: #d03b3b;
    margin-top: 10px;
    display: none;
  }
  .spinner {
    display: none;
    font-size: 12px;
    color: #898781;
    margin-top: 10px;
    text-align: center;
  }
</style>
</head>

    const ct   = base64ToBytes(PAYLOAD.ct);

    // Derive key: PBKDF2-SHA256, 100000 iterations, 32 bytes
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), {name: 'PBKDF2'}, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256'},
      keyMaterial,
      {name: 'AES-CBC', length: 256},
      false,
      ['decrypt']
    );

    const plaintext = await crypto.subtle.decrypt({name: 'AES-CBC', iv}, key, ct);
    const html = new TextDecoder().decode(plaintext);

    // Replace current page with decrypted content
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    spin.style.display = 'none';
    err.style.display = 'block';
  }
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

document.getElementById('pw').addEventListener('keydown', e => {
  if (e.key === 'Enter') decrypt();
});
</script>
